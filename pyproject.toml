[project]
name = "mouse-run-run"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "huggingface-hub>=1.21.0",
    "numpy>=2.5.0",
    "safetensors>=0.8.0",
    "tensorboard>=2.21.0",
    "torch>=2.12.1",
]

[project.scripts]
collect-marl-rollouts = "mouse_run_run.rollout_cli:main"
collect-paper-marl-rollouts = "mouse_run_run.paper_rollout_cli:main"
evaluate-marl = "mouse_run_run.evaluate_cli:main"
evaluate-paper-marl = "mouse_run_run.paper_eval_cli:main"
validate-marl-checkpoints = "mouse_run_run.checkpoint_cli:main"
train-marl = "mouse_run_run.cli:main"
upload-marl-artifacts = "mouse_run_run.hf_upload_cli:main"
visualize-marl = "mouse_run_run.viewer:main"

[build-system]
requires = ["setuptools>=81.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mouse_run_run*"]

[tool.setuptools.package-data]
mouse_run_run = ["viewer_static/*.html"]
