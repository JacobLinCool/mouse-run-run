<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mouse Run Run — Analysis Report</title>
    <style>
      :root {
        --paper: #f7f7f2;
        --panel: #ffffff;
        --ink: #202426;
        --muted: #697177;
        --line: #d9ddd8;
        --grid: #e5e7df;
        --chaser: #d84f45;
        --explorer: #2189a8;
        --green: #4f8a5b;
        --amber: #c4862b;
        --danger: #b42318;
        --shadow: 0 12px 28px rgba(28, 32, 34, 0.12);
        --rnn: #d84f45;
        --mlp: #8a8f4f;
        --ssm: #c4862b;
        --transformer: #2189a8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      .topbar {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .topbar strong { font-size: 17px; }
      .topbar span { color: var(--muted); font-size: 13px; }
      .topbar a { margin-left: auto; color: var(--explorer); text-decoration: none; font-weight: 650; font-size: 14px; }
      main { max-width: 1180px; margin: 0 auto; padding: 24px; display: grid; gap: 22px; }
      section.card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      section.card > h2 {
        margin: 0;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        font-size: 16px;
      }
      section.card > h2 small { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 8px; }
      .card-body { padding: 16px 18px; }
      p.lead { color: var(--muted); margin: 0 0 14px; }
      table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
      th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--grid); }
      th:first-child, td:first-child { text-align: left; }
      thead th { color: var(--muted); font-weight: 650; border-bottom: 1px solid var(--line); }
      tbody tr:hover { background: #fafbf8; }
      .arch { font-weight: 700; }
      .arch.RNN { color: var(--rnn); }
      .arch.MLP { color: var(--mlp); }
      .arch.SSM { color: var(--ssm); }
      .arch.Transformer { color: var(--transformer); }
      .bar-wrap { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
      .bar { height: 8px; border-radius: 999px; background: var(--explorer); }
      .fig { display: grid; gap: 6px; }
      .fig img { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
      .fig figcaption { color: var(--muted); font-size: 12.5px; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } }
      .heat td { text-align: center; font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; }
      .heat th { text-align: center; }
      .callout {
        border-left: 3px solid var(--explorer);
        background: #f0f6f8;
        padding: 10px 14px;
        border-radius: 6px;
        margin: 0 0 14px;
        font-size: 14px;
      }
      .prose { font-size: 14px; }
      .prose-body { max-width: 760px; }
      .prose h1 { font-size: 20px; }
      .prose h2 { font-size: 16px; margin-top: 22px; }
      .prose h3 { font-size: 14.5px; margin-top: 16px; }
      .prose p { margin: 10px 0; }
      .prose ul { margin: 10px 0; padding-left: 22px; }
      .prose li { margin: 4px 0; }
      .prose table { margin: 12px 0; display: block; overflow-x: auto; }
      .prose code { background: #eef0ea; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
      .prose details > summary { cursor: pointer; font-weight: 650; color: var(--explorer); margin-bottom: 8px; }
      .muted { color: var(--muted); }
      .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #eef0ea; font-size: 12px; color: var(--muted); }
      .err { color: var(--danger); padding: 20px; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <strong>Mouse Run Run</strong>
      <span>Analysis Report &mdash; Zhang et al. (2025) reproduction &amp; cross-architecture study</span>
      <a href="/">Trajectory explorer &rarr;</a>
    </div>
    <main id="main"><p class="muted" style="padding:24px">Loading analysis&hellip;</p></main>

    <script>
      const ORDER = ["RNN", "MLP", "SSM", "Transformer"];
      const ARCH_COLOR = { RNN: "#d84f45", MLP: "#8a8f4f", SSM: "#c4862b", Transformer: "#2189a8" };
      const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v) ? "&mdash;" : Number(v).toFixed(d));
      const pct = (v) => (v === null || v === undefined ? "&mdash;" : (v * 100).toFixed(0) + "%");

      async function load() {
        const main = document.getElementById("main");
        let data;
        try {
          data = await (await fetch("/api/report")).json();
        } catch (e) {
          main.innerHTML = `<p class="err">Failed to load /api/report: ${e}</p>`;
          return;
        }
        if (!data.experiments || !data.experiments.length) {
          main.innerHTML = `<p class="err">No analyzed experiments found under runs/reports + runs/analyses.</p>`;
          return;
        }
        main.innerHTML = "";
        main.appendChild(overview(data));
        if (data.claim_alignment) main.appendChild(claimSection(data.claim_alignment));
        main.appendChild(behaviorSection(data));
        main.appendChild(neuralSection(data));
        main.appendChild(crossArchSection(data));
        if (data.report_markdown) main.appendChild(reportSection(data.report_markdown));
      }

      function el(html) {
        const t = document.createElement("template");
        t.innerHTML = html.trim();
        return t.content.firstElementChild;
      }

      function overview(data) {
        const rows = data.experiments
          .map((e) => {
            const vp = e.valid_pairs || {};
            return `<tr>
              <td class="arch ${e.architecture}">${e.architecture}</td>
              <td class="muted" style="text-align:left">${e.description || ""}</td>
              <td>${vp.social ?? "&mdash;"}</td>
              <td>${vp.non_social ?? "&mdash;"}</td>
              <td>${e.neural && e.neural.social ? (e.neural.social.n_degenerate ?? 0) : "&mdash;"}</td>
            </tr>`;
          })
          .join("");
        return el(`<section class="card"><h2>Experiments <small>four architectures, identical task &amp; pipeline</small></h2>
          <div class="card-body">
            <p class="callout"><strong>Question.</strong> Do different agent architectures, trained identically, learn the same internal representations of the social interaction?
            <strong>Answer:</strong> no &mdash; behavior, residualized PLSC, and CKA agree the RNN is the outlier; only it develops genuine internal shared dynamics at low mutual vision.</p>
            <table><thead><tr><th>architecture</th><th>memory mechanism</th><th>valid social pairs</th><th>valid non-social</th><th>degenerate (social)</th></tr></thead>
            <tbody>${rows}</tbody></table>
          </div></section>`);
      }

      // Paper claim alignment (C1-C5)
      function claimSection(ca) {
        const badge = (v) => {
          const map = { reproduces: ["#2f7d4f", "reproduces"], partial: ["#c4862b", "partial"], fails: ["#b42318", "does not"] };
          const [c, t] = map[v] || ["#697177", v];
          return `<span style="display:inline-block;padding:2px 9px;border-radius:999px;background:${c};color:#fff;font-size:12px;font-weight:650">${t}</span>`;
        };
        const rows = ca.claims
          .map(
            (c) => `<tr>
              <td class="arch" style="white-space:nowrap">${c.id}</td>
              <td style="text-align:left">${c.claim}</td>
              <td style="text-align:center">${badge(c.verdict)}</td>
              <td class="muted" style="text-align:left;font-size:12.5px">${c.detail}</td>
            </tr>`
          )
          .join("");
        let c5 = "";
        if (ca.c5 && Object.keys(ca.c5).length) {
          const r = Object.entries(ca.c5)
            .map(
              ([arch, v]) =>
                `<tr><td class="arch ${arch}">${arch}</td><td>${fmt(v.unperturbed, 1)}</td><td>${fmt(v.shared_removed, 1)}</td><td>${fmt(v.random_removed, 1)}</td></tr>`
            )
            .join("");
          c5 = `<h3 style="margin:18px 0 6px;font-size:14px">C5 perturbation — collisions per episode</h3>
            <table><thead><tr><th>architecture</th><th>unperturbed</th><th>shared removed</th><th>random removed</th></tr></thead><tbody>${r}</tbody></table>
            <p class="muted" style="font-size:12px;margin-top:6px">Removing the shared dimensions degrades social behavior — but so does removing comparable random activity, so the effect is not shared-specific (low-dimensional representations).</p>`;
        }
        return el(`<section class="card"><h2>Paper claim alignment <small>the five AI claims, C1&ndash;C5</small></h2>
          <div class="card-body">
            <p class="callout">The paper's biology&harr;AI bridge is at the level of <strong>representations, not cell types</strong> ("specific cell types in mice do not correspond directly to neural networks in artificial agents"). C1&ndash;C3 reproduce cleanly; C4&ndash;C5 reproduce their qualitative core, with the gaps traced to two measurable properties of our agents (the L2-regularized RNN's atypical strategy and low-dimensional representations).</p>
            <table><thead><tr><th>claim</th><th>statement</th><th>verdict</th><th>what we found</th></tr></thead><tbody>${rows}</tbody></table>
            ${c5}
          </div></section>`);
      }

      // Fig 5 — behavioral
      function behaviorSection(data) {
        const maxColl = Math.max(...data.experiments.map((e) => beh(e, "social", "random_explorer", "collisions_per_episode") || 0));
        const body = data.experiments
          .map((e) => {
            const sc = beh(e, "social", "random_explorer", "collisions_per_episode");
            const nc = beh(e, "non_social", "random_explorer", "collisions_per_episode");
            const vis = beh(e, "social", "random_explorer", "chaser_partner_vision");
            const esc = beh(e, "social", "random_chaser", "collisions_per_episode");
            const w = maxColl ? (sc / maxColl) * 160 : 0;
            return `<tr>
              <td class="arch ${e.architecture}">${e.architecture}</td>
              <td><div class="bar-wrap"><span>${fmt(sc)}</span><span class="bar" style="width:${w}px;background:${ARCH_COLOR[e.architecture]}"></span></div></td>
              <td>${fmt(nc)}</td>
              <td>${pct(vis)}</td>
              <td>${fmt(esc)}</td>
            </tr>`;
          })
          .join("");
        return el(`<section class="card"><h2>Behavior &mdash; standardized random opponent <small>Fig. 5</small></h2>
          <div class="card-body">
            <p class="lead">Chaser collisions against a random explorer (capability), the non-social control, chaser partner-in-vision, and the explorer's collisions suffered against a random chaser (lower = better escape).</p>
            <table><thead><tr><th>architecture</th><th>chaser collisions (social)</th><th>collisions (non-social)</th><th>partner-in-vision</th><th>explorer collisions-suffered</th></tr></thead>
            <tbody>${body}</tbody></table>
            <p class="muted" style="font-size:12.5px;margin-top:10px">All architectures learn role-specific social behavior. The RNN converged to a distinct low-vision "stealth" strategy (few collisions, low vision) &mdash; the others to high-vision "pursuit". Raw capability is not the headline; the internal representation is.</p>
          </div></section>`);
      }

      // Fig 6 — neural
      function neuralSection(data) {
        const rows = data.experiments
          .map((e) => {
            const s = e.neural && e.neural.social ? e.neural.social : {};
            const ns = e.neural && e.neural.non_social ? e.neural.non_social : {};
            return `<tr>
              <td class="arch ${e.architecture}">${e.architecture}</td>
              <td>${fmt(s.decode_collision)}</td>
              <td>${fmt(s.decode_escape)}</td>
              <td>${fmt(s.decode_approach)}</td>
              <td>${fmt(s.plsc_top_dim_correlation)}</td>
              <td class="muted">${fmt(ns.plsc_top_dim_correlation)}</td>
            </tr>`;
          })
          .join("");
        return el(`<section class="card"><h2>Neural representation &mdash; social agents <small>Fig. 6</small></h2>
          <div class="card-body">
            <p class="lead">Linear decoding balanced accuracy of social events from hidden states (shuffled controls &asymp; 0.50), and the PLSC shared-dimension top correlation between the two agents.</p>
            <table><thead><tr><th>architecture</th><th>decode collision</th><th>decode escape</th><th>decode approach</th><th>PLSC top r (social)</th><th>PLSC top r (non-social)</th></tr></thead>
            <tbody>${rows}</tbody></table>
            <p class="muted" style="font-size:12.5px;margin-top:10px">Event decoding replicates across all architectures (C2). The raw PLSC top correlation is <em>not</em> directly comparable across architectures &mdash; the transformer's positional embedding inflates its non-social value. The cross-architecture section corrects this by removing the time-locked scaffold.</p>
          </div></section>`);
      }

      // Cross-architecture: figures + CKA + vision-conditioned
      function crossArchSection(data) {
        const figs = data.figures || {};
        const figHtml = (name, cap) =>
          figs[name] ? `<figure class="fig"><img src="${figs[name]}" alt="${cap}"/><figcaption>${cap}</figcaption></figure>` : "";
        const cka = ckaTable(data.cross_architecture);
        return el(`<section class="card"><h2>Cross-architecture comparison <small>the headline result</small></h2>
          <div class="card-body">
            <p class="callout"><strong>After removing each architecture's deterministic time-locked scaffold</strong> (across-episode mean at each step &mdash; positional embeddings, hidden-state clocks), only the RNN achieves shared representation when the agents cannot see each other. The other architectures' sharing is vision-gated (common-input-like).</p>
            <div class="two-col">
              ${figHtml("sharing_vs_vision", "Residualized PLSC top correlation vs partner-in-vision (social units). Only the RNN populates the low-vision, high-sharing region.")}
              ${figHtml("cross_arch_cka", "Cross-architecture representational similarity (linear CKA, common game-state probe). The RNN is the outlier; the other three cluster.")}
            </div>
            ${cka}
          </div></section>`);
      }

      function ckaTable(cross) {
        if (!cross || !cross.cka) return "";
        const order = cross.architecture_order || ORDER;
        const vals = order.flatMap((a) => order.map((b) => cross.cka[`${a}|${b}`])).filter((v) => v != null);
        const lo = Math.min(...vals),
          hi = Math.max(...vals);
        const color = (v) => {
          if (v == null) return "#ccc";
          const t = (v - lo) / (hi - lo || 1);
          // magma-ish: dark -> bright
          const r = Math.round(20 + t * 220),
            g = Math.round(10 + t * 90),
            b = Math.round(60 + t * 60);
          return `rgb(${r},${g},${b})`;
        };
        const head = `<tr><th></th>${order.map((a) => `<th>${a}</th>`).join("")}</tr>`;
        const body = order
          .map(
            (a) =>
              `<tr><th style="text-align:left">${a}</th>${order
                .map((b) => {
                  const v = cross.cka[`${a}|${b}`];
                  return `<td style="background:${color(v)}">${fmt(v)}</td>`;
                })
                .join("")}</tr>`
          )
          .join("");
        return `<h3 style="margin:18px 0 6px;font-size:14px">Linear CKA matrix</h3><table class="heat"><thead>${head}</thead><tbody>${body}</tbody></table>`;
      }

      // Full study prose (minimal markdown render)
      function reportSection(md) {
        return el(`<section class="card"><h2>Full study report</h2>
          <div class="card-body prose"><details open><summary>Full cross-architecture representation study</summary><div class="prose-body">${renderMarkdown(md)}</div></details></div></section>`);
      }

      function beh(e, task, mode, key) {
        try {
          return e.behavior[task][mode][key];
        } catch {
          return null;
        }
      }

      // Tiny, safe-enough markdown -> HTML for the report prose.
      function esc(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function renderMarkdown(md) {
        const lines = md.split("\n");
        let html = "",
          inTable = false,
          inCode = false,
          para = [], // buffered soft-wrapped paragraph lines
          list = false;
        const inline = (s) =>
          esc(s)
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/`(.+?)`/g, "<code>$1</code>")
            .replace(/\*(.+?)\*/g, "<em>$1</em>");
        // A blank line, heading, table, etc. flushes the running paragraph —
        // consecutive non-blank text lines are one paragraph (Markdown
        // soft-wrap), so hard-wrapped source no longer breaks mid-sentence.
        const flushPara = () => {
          if (para.length) {
            html += `<p>${inline(para.join(" "))}</p>`;
            para = [];
          }
        };
        const closeList = () => {
          if (list) {
            html += "</ul>";
            list = false;
          }
        };
        for (let raw of lines) {
          if (raw.startsWith("```")) {
            flushPara();
            closeList();
            inCode = !inCode;
            html += inCode ? "<pre style='background:#f2f3ef;padding:10px;border-radius:6px;overflow:auto'>" : "</pre>";
            continue;
          }
          if (inCode) {
            html += esc(raw) + "\n";
            continue;
          }
          const isRow = /^\s*\|.*\|\s*$/.test(raw);
          if (isRow) {
            flushPara();
            closeList();
            const cells = raw.trim().replace(/^\||\|$/g, "").split("|");
            if (/^[\s:|-]+$/.test(raw.replace(/\|/g, ""))) continue; // separator
            if (!inTable) {
              html += "<table>";
              inTable = true;
            }
            html += "<tr>" + cells.map((c) => `<td>${inline(c.trim())}</td>`).join("") + "</tr>";
            continue;
          } else if (inTable) {
            html += "</table>";
            inTable = false;
          }
          if (/^#{1,3} /.test(raw)) {
            flushPara();
            closeList();
            const level = raw.match(/^#+/)[0].length;
            html += `<h${level}>${inline(raw.replace(/^#+ /, ""))}</h${level}>`;
          } else if (/^- /.test(raw)) {
            flushPara();
            if (!list) {
              html += "<ul>";
              list = true;
            }
            html += `<li>${inline(raw.slice(2))}</li>`;
          } else if (raw.trim() === "" || /^---+$/.test(raw.trim())) {
            flushPara();
            closeList();
          } else {
            closeList();
            para.push(raw.trim());
          }
        }
        flushPara();
        closeList();
        if (inTable) html += "</table>";
        return html;
      }

      load();
    </script>
  </body>
</html>
